<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 520" width="380" height="520">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2a7d4f"/>
    </marker>
    <marker id="arrowP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b5091"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="70" y="12" width="240" height="42" rx="5" fill="#3574b0"/>
  <text x="190" y="31" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">ChIA-PET Input Data</text>
  <text x="190" y="46" text-anchor="middle" fill="#bcd4ee" font-family="Helvetica,Arial,sans-serif" font-size="8.5">anchors, PET clusters, singletons, segments</text>

  <line x1="190" y1="54" x2="190" y2="72" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tree construction -->
  <rect x="70" y="72" width="240" height="42" rx="5" fill="#607d8b"/>
  <text x="190" y="91" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Hierarchical Tree Construction</text>
  <text x="190" y="106" text-anchor="middle" fill="#c8d6dc" font-family="Helvetica,Arial,sans-serif" font-size="8.5">chromosome &gt; segment &gt; anchor &gt; subanchor</text>

  <line x1="190" y1="114" x2="190" y2="142" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 1: Heatmap MC -->
  <rect x="55" y="142" width="270" height="58" rx="5" fill="#d4740c"/>
  <text x="62" y="158" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold">CUDA</text>
  <text x="190" y="164" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Stage 1: Heatmap Monte Carlo</text>
  <text x="190" y="178" text-anchor="middle" fill="#fdd" font-family="Helvetica,Arial,sans-serif" font-size="8.5">Warp-level simulated annealing</text>
  <text x="190" y="192" text-anchor="middle" fill="#fdd" font-family="Helvetica,Arial,sans-serif" font-size="8.5">Territory and segment positioning</text>

  <line x1="190" y1="200" x2="190" y2="218" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Arc MC -->
  <rect x="55" y="218" width="270" height="58" rx="5" fill="#d4740c"/>
  <text x="62" y="234" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold">CUDA</text>
  <text x="190" y="240" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Stage 2: Arc-distance Monte Carlo</text>
  <text x="190" y="254" text-anchor="middle" fill="#fdd" font-family="Helvetica,Arial,sans-serif" font-size="8.5">Warp-level simulated annealing</text>
  <text x="190" y="268" text-anchor="middle" fill="#fdd" font-family="Helvetica,Arial,sans-serif" font-size="8.5">Anchor refinement from PET clusters</text>

  <line x1="190" y1="276" x2="190" y2="294" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Smooth MC -->
  <rect x="55" y="294" width="270" height="58" rx="5" fill="#d4740c"/>
  <text x="62" y="310" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold">CUDA</text>
  <text x="190" y="316" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Stage 3: Smoothing Monte Carlo</text>
  <text x="190" y="330" text-anchor="middle" fill="#fdd" font-family="Helvetica,Arial,sans-serif" font-size="8.5">Polymer spring constraints</text>
  <text x="190" y="344" text-anchor="middle" fill="#fdd" font-family="Helvetica,Arial,sans-serif" font-size="8.5">Subanchor bead chain generation</text>

  <!-- GPU Resource Cache (right side) -->
  <rect x="340" y="155" width="30" height="185" rx="4" fill="#2a7d4f"/>
  <text x="355" y="252" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" transform="rotate(-90,355,252)">Persistent GPU Resource Cache</text>

  <!-- Dashed arrows from cache to kernels -->
  <line x1="340" y1="171" x2="325" y2="171" stroke="#2a7d4f" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>
  <line x1="340" y1="247" x2="325" y2="247" stroke="#2a7d4f" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>
  <line x1="340" y1="323" x2="325" y2="323" stroke="#2a7d4f" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>

  <!-- Energy function (left side) -->
  <rect x="4" y="190" width="40" height="115" rx="4" fill="#6b5091"/>
  <text x="24" y="230" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="7.5" font-weight="bold" transform="rotate(-90,24,245)">Energy Function</text>
  <text x="24" y="285" text-anchor="middle" fill="#d4c4e8" font-family="Helvetica,Arial,sans-serif" font-size="6.5">distance</text>
  <text x="24" y="295" text-anchor="middle" fill="#d4c4e8" font-family="Helvetica,Arial,sans-serif" font-size="6.5">spring</text>

  <!-- Dashed arrows from energy to kernels -->
  <line x1="44" y1="210" x2="55" y2="171" stroke="#6b5091" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowP)"/>
  <line x1="44" y1="247" x2="55" y2="247" stroke="#6b5091" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowP)"/>
  <line x1="44" y1="284" x2="55" y2="323" stroke="#6b5091" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowP)"/>

  <!-- Arrow to output -->
  <line x1="190" y1="352" x2="190" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Quality metrics -->
  <rect x="55" y="380" width="270" height="42" rx="5" fill="#607d8b"/>
  <text x="190" y="399" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Quality Assessment</text>
  <text x="190" y="414" text-anchor="middle" fill="#c8d6dc" font-family="Helvetica,Arial,sans-serif" font-size="8.5">RMSD, Pearson r, stratum-adjusted correlation</text>

  <line x1="190" y1="422" x2="190" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="70" y="450" width="240" height="42" rx="5" fill="#3574b0"/>
  <text x="190" y="469" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">3D Chromatin Structure</text>
  <text x="190" y="484" text-anchor="middle" fill="#bcd4ee" font-family="Helvetica,Arial,sans-serif" font-size="8.5">HCM, mmCIF, PDB output formats</text>
</svg>
